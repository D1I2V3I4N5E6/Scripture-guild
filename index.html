<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- ── Primary Meta Tags ──────────────────────────────────── -->
    <!-- Browser tab title: kept under 60 characters -->
    <title>Scripture Guild | Learn &amp; Understand God's Word</title>

    <!-- Meta description: kept under 160 characters -->
    <meta
      name="description"
      content="Explore the Bible with Scripture Guild through easy-to-understand Bible studies, devotionals, and biblical teachings that help you grow in faith."
    />

    <!-- ── Open Graph (Social Sharing Previews) ───────────────── -->
    <!-- These tags control how the link looks when shared on
         Facebook, WhatsApp, LinkedIn, and other platforms. -->
    <meta property="og:type"        content="website" />
    <meta property="og:title"       content="Scripture Guild | Learn &amp; Understand God's Word" />
    <meta
      property="og:description"
      content="Explore the Bible with Scripture Guild through easy-to-understand Bible studies, devotionals, and biblical teachings that help you grow in faith."
    />
    <!-- Update og:url to your live domain once deployed -->
    <meta property="og:url"         content="https://scriptureguild.netlify.app" />
    <!-- Add a real image path once you have a site preview image -->
    <!-- <meta property="og:image" content="/og-preview.jpg" /> -->

    <!-- ── Twitter / X Card ───────────────────────────────────── -->
    <meta name="twitter:card"        content="summary_large_image" />
    <meta name="twitter:title"       content="Scripture Guild | Learn &amp; Understand God's Word" />
    <meta
      name="twitter:description"
      content="Explore the Bible with Scripture Guild through easy-to-understand Bible studies, devotionals, and biblical teachings that help you grow in faith."
    />

    <!-- ── SEO / Crawler Hints ────────────────────────────────── -->
    <meta name="robots" content="index, follow" />
    <meta name="author"  content="Scripture Guild" />

    <!-- ── Theme / PWA Colour ─────────────────────────────────── -->
    <!-- Matches the site's deep forest green brand colour -->
    <meta name="theme-color" content="#1a3a1f" />

    <!-- ── Favicon ────────────────────────────────────────────── -->
    <!-- Place your favicon.ico or favicon.png in the public/ folder -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Fallback for browsers that don't support SVG favicons -->
    <!-- <link rel="icon" type="image/png" href="/favicon.png" /> -->
  </head>

  <body>
    <!--
      #root is the single DOM node React mounts into.
      React replaces this element's contents entirely at startup.
      Do not put visible content here — it will be overwritten.
    -->
    <div id="root"></div>

    <!--
      Vite injects the compiled JS bundle here at build time.
      During development, Vite serves this script via its dev server.
    -->
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
