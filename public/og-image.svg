<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <!-- Background gradient: deep forest green to rich midnight -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#0d2010" />
      <stop offset="55%"  stop-color="#1a3a1f" />
      <stop offset="100%" stop-color="#0f2816" />
    </linearGradient>

    <!-- Radial glow emanating from the open Bible pages -->
    <radialGradient id="glowGrad" cx="50%" cy="52%" r="38%">
      <stop offset="0%"   stop-color="#fffbe6" stop-opacity="0.45" />
      <stop offset="40%"  stop-color="#f0d080" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#1a3a1f" stop-opacity="0" />
    </radialGradient>

    <!-- Gold shimmer gradient for the Bible cover -->
    <linearGradient id="coverGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#e8c96a" />
      <stop offset="50%"  stop-color="#c9a84c" />
      <stop offset="100%" stop-color="#a07830" />
    </linearGradient>

    <!-- Parchment gradient for the open pages -->
    <linearGradient id="pageLeft" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#f5f0dc" />
      <stop offset="100%" stop-color="#fdf8ee" />
    </linearGradient>
    <linearGradient id="pageRight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#fdf8ee" />
      <stop offset="100%" stop-color="#f0e8d0" />
    </linearGradient>

    <!-- Cross glow -->
    <radialGradient id="crossGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#c9a84c" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#c9a84c" stop-opacity="0" />
    </radialGradient>

    <filter id="softBlur">
      <feGaussianBlur stdDeviation="3" />
    </filter>
    <filter id="textShadow" x="-5%" y="-10%" width="110%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="6" flood-color="#000" flood-opacity="0.6" />
    </filter>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#c9a84c" flood-opacity="0.7" />
    </filter>
  </defs>

  <!-- ── Background ──────────────────────────────────────────── -->
  <rect width="1200" height="630" fill="url(#bgGrad)" />

  <!-- Subtle texture dots (decorative) -->
  <rect width="1200" height="630" fill="none"
        stroke="#ffffff" stroke-width="0" opacity="0.03" />

  <!-- ── Large Cross (background, subtle) ──────────────────────── -->
  <!-- Glow halo behind cross -->
  <ellipse cx="600" cy="310" rx="180" ry="220" fill="url(#crossGlow)" />

  <!-- Cross vertical bar -->
  <rect x="584" y="130" width="32" height="340"
        rx="4" fill="#c9a84c" opacity="0.13" />
  <!-- Cross horizontal bar -->
  <rect x="480" y="215" width="240" height="32"
        rx="4" fill="#c9a84c" opacity="0.13" />

  <!-- ── Radial Glow (Bible light source) ──────────────────────── -->
  <rect width="1200" height="630" fill="url(#glowGrad)" />

  <!-- Light rays fanning from Bible center -->
  <g opacity="0.07" filter="url(#softBlur)">
    <line x1="600" y1="355" x2="200" y2="80"  stroke="#fffbe6" stroke-width="38" />
    <line x1="600" y1="355" x2="600" y2="40"  stroke="#fffbe6" stroke-width="38" />
    <line x1="600" y1="355" x2="1000" y2="80" stroke="#fffbe6" stroke-width="38" />
    <line x1="600" y1="355" x2="150" y2="400" stroke="#fffbe6" stroke-width="28" />
    <line x1="600" y1="355" x2="1050" y2="400" stroke="#fffbe6" stroke-width="28" />
  </g>

  <!-- ══════════════════════════════════════════════════════════ -->
  <!-- ── Open Bible ─────────────────────────────────────────── -->
  <!-- ══════════════════════════════════════════════════════════ -->

  <!-- Bible spine / back cover shadow -->
  <rect x="358" y="298" width="488" height="192"
        rx="10" fill="#0a1e0d" opacity="0.55" />

  <!-- Bible back cover -->
  <rect x="362" y="295" width="480" height="188"
        rx="9" fill="url(#coverGrad)" />

  <!-- Open left page -->
  <path d="M 370 302 Q 440 285, 598 292 L 598 470 Q 440 478, 370 462 Z"
        fill="url(#pageLeft)" />

  <!-- Open right page -->
  <path d="M 602 292 Q 760 285, 832 302 L 832 462 Q 760 478, 602 470 Z"
        fill="url(#pageRight)" />

  <!-- Centre spine highlight -->
  <path d="M 597 288 Q 600 380, 603 472"
        fill="none" stroke="#c9a84c" stroke-width="3" opacity="0.6" />

  <!-- Left page text lines -->
  <g fill="#8a7a60" opacity="0.55">
    <rect x="398" y="322" width="160" height="5" rx="2" />
    <rect x="390" y="334" width="168" height="5" rx="2" />
    <rect x="392" y="346" width="162" height="5" rx="2" />
    <rect x="396" y="358" width="155" height="5" rx="2" />
    <rect x="390" y="370" width="165" height="5" rx="2" />
    <rect x="395" y="382" width="140" height="5" rx="2" />
    <rect x="390" y="406" width="164" height="5" rx="2" />
    <rect x="394" y="418" width="158" height="5" rx="2" />
    <rect x="391" y="430" width="162" height="5" rx="2" />
    <rect x="396" y="442" width="148" height="5" rx="2" />
  </g>

  <!-- Left page verse highlight (gold line) -->
  <rect x="390" y="393" width="168" height="7" rx="3" fill="#c9a84c" opacity="0.25" />

  <!-- Right page text lines -->
  <g fill="#8a7a60" opacity="0.55">
    <rect x="642" y="322" width="160" height="5" rx="2" />
    <rect x="638" y="334" width="168" height="5" rx="2" />
    <rect x="640" y="346" width="164" height="5" rx="2" />
    <rect x="644" y="358" width="154" height="5" rx="2" />
    <rect x="638" y="370" width="163" height="5" rx="2" />
    <rect x="645" y="382" width="145" height="5" rx="2" />
    <rect x="638" y="406" width="162" height="5" rx="2" />
    <rect x="642" y="418" width="156" height="5" rx="2" />
    <rect x="640" y="430" width="160" height="5" rx="2" />
    <rect x="646" y="442" width="148" height="5" rx="2" />
  </g>

  <!-- Right page verse highlight (gold line) -->
  <rect x="638" y="393" width="165" height="7" rx="3" fill="#c9a84c" opacity="0.25" />

  <!-- Bible front cover flap (bottom, curled slightly) -->
  <path d="M 370 460 Q 440 475, 598 470 Q 598 488, 598 488 Q 440 492, 370 478 Z"
        fill="#b8942a" opacity="0.6" />
  <path d="M 602 470 Q 760 475, 832 460 L 832 478 Q 760 492, 602 488 Z"
        fill="#b8942a" opacity="0.6" />

  <!-- Bible cover edge lines (decorative border) -->
  <rect x="363" y="296" width="478" height="188"
        rx="8" fill="none" stroke="#e0c060" stroke-width="2" opacity="0.4" />

  <!-- Small cross embossed on the cover (bottom centre) -->
  <g filter="url(#goldGlow)" opacity="0.5">
    <rect x="594" y="474" width="12" height="28" rx="2" fill="#c9a84c" />
    <rect x="585" y="481" width="30" height="12" rx="2" fill="#c9a84c" />
  </g>

  <!-- ── Small sparkle particles around Bible ──────────────── -->
  <g fill="#c9a84c" opacity="0.5">
    <circle cx="350" cy="310" r="3" />
    <circle cx="340" cy="360" r="2" />
    <circle cx="855" cy="315" r="3" />
    <circle cx="862" cy="370" r="2" />
    <circle cx="480" cy="270" r="2.5" />
    <circle cx="720" cy="268" r="2.5" />
    <circle cx="600" cy="258" r="3.5" />
  </g>

  <!-- ══════════════════════════════════════════════════════════ -->
  <!-- ── Typography ─────────────────────────────────────────── -->
  <!-- ══════════════════════════════════════════════════════════ -->

  <!-- Site name: Scripture Guild -->
  <text
    x="600" y="152"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="82"
    font-weight="bold"
    text-anchor="middle"
    fill="#c9a84c"
    filter="url(#textShadow)"
    letter-spacing="2"
  >Scripture Guild</text>

  <!-- Decorative divider line under site name -->
  <line x1="340" y1="172" x2="860" y2="172"
        stroke="#c9a84c" stroke-width="2" opacity="0.4" />
  <!-- Small diamond in the middle of divider -->
  <polygon points="600,164 608,172 600,180 592,172"
           fill="#c9a84c" opacity="0.6" />

  <!-- Tagline: Understand the Bible More Clearly -->
  <text
    x="600" y="224"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="34"
    font-weight="normal"
    font-style="italic"
    text-anchor="middle"
    fill="#f5f0e8"
    filter="url(#textShadow)"
    opacity="0.92"
    letter-spacing="1"
  >Understand the Bible More Clearly</text>

  <!-- Bottom caption / URL hint -->
  <text
    x="600" y="568"
    font-family="Arial, Helvetica, sans-serif"
    font-size="22"
    text-anchor="middle"
    fill="#c9a84c"
    opacity="0.65"
    letter-spacing="3"
  >SCRIPTURE GUILD  •  Your Daily Faith Companion</text>

  <!-- Subtle bottom divider -->
  <line x1="200" y1="580" x2="1000" y2="580"
        stroke="#c9a84c" stroke-width="1" opacity="0.2" />
</svg>
